services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
  assistant:
    build: .
    depends_on: [ollama]
    environment:
      MANUAL_ASSISTANT_LLM_BASE_URL: http://ollama:11434/v1
      MANUAL_ASSISTANT_LLM_MODEL: qwen2.5:3b-instruct
    volumes: ["./data:/app/data"]
volumes:
  ollama:
